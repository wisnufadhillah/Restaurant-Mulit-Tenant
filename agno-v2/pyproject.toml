[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-restaurant-chatbot-agno-v2"
version = "0.1.0"
description = "Standalone Agno chatbot service for AI-PoweredRestaurant"
requires-python = ">=3.11"
dependencies = [
  "agno>=1.7.0",
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "openai>=1.50.0",
  "python-dotenv>=1.0.0",
  "uvicorn[standard]>=0.30.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
