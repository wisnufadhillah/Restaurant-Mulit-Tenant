name: multi-tenant
services:
  database:
    container_name: multi-tenant
    image: pgvector/pgvector:0.8.1-pg17
    ports:
      - "127.0.0.1:55432:5432"
    environment:
      POSTGRES_USER: restaurant
      POSTGRES_DB: restaurant
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 3s
      retries: 10
secrets:
  postgres_password:
    file: ./.local/postgres-password
volumes:
  postgres_data:
    name: multi-tenant_postgres_data
