<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2460" height="1710" viewBox="0 0 2460 1710" role="img" aria-labelledby="title desc"><title id="title">ERD Assistant dan Pengetahuan</title><desc id="desc">Relasi PK ke FK per atribut. Referensi parent diulang agar garis tidak melintasi tabel lain.</desc><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" fill="#0f172a"><text x="40" y="45" font-size="28">ERD Assistant dan Pengetahuan</text>
<text x="40" y="88" font-size="17">PK = identitas utama | UK = nilai unik | FK = referensi. Garis menghubungkan baris PK ke baris FK.</text>
<text x="40" y="123" font-size="17">Kotak referensi berulang = tabel yang sama, bukan tabel baru. Setiap panel menampilkan seluruh atribut tabel tujuan.</text>
<text x="40" y="158" font-size="17">1 — 0..N: satu parent dapat memiliki nol atau banyak child. Relasi proposal–reservasi: 0..1 — 0..1.</text>
