<text x="40" y="1583" font-size="17">Relasi komposit tetap wajib: tenant_id + outlet_id/session_id/document_id harus cocok dengan parent yang sama.</text>
<text x="40" y="1617" font-size="17">Proposal.reservation_id nullable dan unik. published_by mengacu staff tenant yang sama; sesi chat bukan izin akses booking.</text>
<text x="40" y="1651" font-size="17">Diagram rancangan domain; bukan pernyataan seluruh tabel dan fitur sudah diimplementasikan.</text></g></svg>
